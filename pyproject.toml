[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smops"
dynamic = ["version", "readme"]
description = "Python script for interpolating FITS model images over frequency"
authors = [{ name = "L. Andati", email = "landati@duck.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["smops", "model frequency interpolation", "FITS images"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "astropy",
    "click>=8",
    "numpy",
    "psutil",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ratt-ru/smops"
Issues = "https://github.com/ratt-ru/smops/issues"

[project.scripts]
smops = "smops.smooth:main"

[tool.setuptools.packages.find]
include = ["smops", "smops.*"]

[tool.setuptools.dynamic]
version = { attr = "smops.VERSION" }
readme = { file = ["README.rst", "HISTORY.rst"], content-type = "text/x-rst" }

[tool.pytest.ini_options]
testpaths = ["tests"]
